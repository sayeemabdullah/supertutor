name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself, not the merge commit, so the
          # rebuilt archive can be committed back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Validate skill structure
        run: python3 scripts/validate.py

      - name: Rebuild the .skill archive from source
        run: ./scripts/build.sh

      - name: Did the archive change?
        id: diff
        run: |
          # --porcelain also catches the untracked case, which git diff misses
          if [ -z "$(git status --porcelain -- supertutor.skill)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "supertutor.skill is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "supertutor.skill was stale — rebuilt from supertutor/"
          fi

      - name: Commit the refreshed .skill
        if: steps.diff.outputs.changed == 'true'
        env:
          # PR from the same repo -> push to the PR branch.
          # Push to main (post-merge, or a direct push) -> self-heal main.
          # Fork PR -> read-only token, nothing to push; handled below.
          IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$IS_SAME_REPO_PR" != "true" ] && [ "$IS_MAIN_PUSH" != "true" ]; then
            echo "::error::supertutor.skill does not match supertutor/, and this event can't push a fix (fork PR). A maintainer must run ./scripts/build.sh on a branch and merge it."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supertutor.skill
          git commit -m "chore: rebuild supertutor.skill"
          if [ "$IS_SAME_REPO_PR" = "true" ]; then
            git push origin "HEAD:${PR_BRANCH}"
          else
            git push origin "HEAD:main"
          fi
