name: Validate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself, not the merge commit, so the
          # rebuilt archive can be committed back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Validate skill structure
        run: python3 scripts/validate.py

      - name: Rebuild the .skill archive from source
        run: ./scripts/build.sh

      - name: Did the archive change?
        id: diff
        run: |
          # --porcelain also catches the untracked case, which git diff misses
          if [ -z "$(git status --porcelain -- supertutor.skill)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "supertutor.skill is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "supertutor.skill was stale — rebuilt from supertutor/"
          fi

      # Same-repo PR: commit the rebuild onto the PR branch, so a stale archive
      # is fixed before review and reaches main only through the maintainer's
      # merge. Nothing is ever pushed to main by CI.
      - name: Commit the refreshed .skill to the PR branch
        if: >
          steps.diff.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supertutor.skill
          git commit -m "chore: rebuild supertutor.skill"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      # Anything CI can't fix on a branch — a fork PR (read-only token) or a
      # push to main whose archive drifted — fails loudly for a maintainer.
      - name: Report stale archive
        if: >
          steps.diff.outputs.changed == 'true' &&
          !(github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "::error::supertutor.skill does not match supertutor/. Run ./scripts/build.sh on a branch and open a PR."
          exit 1
